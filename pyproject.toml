[project]
name = "workspace"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pyobjc-framework-applicationservices>=12.1",
    "pyobjc-framework-cocoa>=12.1",
    "pyobjc-framework-quartz>=12.1",
]

[tool.uv]
dev-dependencies = [
    "lefthook>=1.13.5",
    "pyright>=1.1.405",
    "ruff>=0.13.2",
]

[tool.ruff]
src = ["src"]
line-length = 120

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "ANN1", # 非推奨ルール
    "COM812", "ISC001", # Ruffの警告が出るので無視
    "D", # docstring関連は緩くやりたいので全部無視する
    "TD001", # FIXMEをコメントのタグに使用可能にする
    "TD002", # TODOのauthorを不要にする
    "TD003", # TODOのチケットへのリンクを不要にする
    "ANN201", # 毎回関数の返り値の型を書くのは面倒なので無視する
    "T201", # printはCLIツールとして意図的に使用
    "N817", # ApplicationServices as AS は慣習的な略称
    "ANN401", # pyobjcのAny型は避けられない
    "FBT003", # pyobjcのC関数バインディングはキーワード引数不可
    "PLW0603", # グローバルキャッシュパターン
    # "PD011", # pandasを使う場合
    # "B008", # FastAPIでDependsを使う場合
]
extend-select = ["I"]
# https://docs.astral.sh/ruff/settings/#lint_logger-objects
logger-objects = []

[tool.hatch.build.targets.wheel]
packages = ["src/slack_post_interceptor"]

[project.scripts]
slack-post-interceptor = "slack_post_interceptor.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pyright]
typeCheckingMode = "strict"
# pyobjc にはスタブが存在しないため、関連するエラーを抑制する
reportMissingTypeStubs = "none"
reportUnknownMemberType = "none"
reportUnknownArgumentType = "none"
reportUnknownVariableType = "none"
reportUnknownParameterType = "none"
reportAttributeAccessIssue = "none"
